
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Install Android SDK
        run: |
          sudo apt-get install -y zip unzip wget
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
      - name: Setup App Structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/sys/update
          cp index.html app/src/main/assets/
      - name: Create Java Code
        run: |
          cat << 'EOF' > app/src/main/java/com/sys/update/MainActivity.java
          package com.sys.update;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF
      - name: Create Manifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sys.update">
              <application android:label="System Update">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: Build APK
        run: |
          cd android-sdk
          wget https://raw.githubusercontent.com/ALightbolt4G/nitron/main/nitron.jar
          java -jar nitron.jar ../app/src/main/AndroidManifest.xml ../app/src/main/java/com/sys/update/MainActivity.java ../app/src/main/assets/index.html
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: compiled-apk
          path: android-sdk/*.apk
    