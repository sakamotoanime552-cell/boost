
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      - name: Create App Structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/sys/update
          cp index.html app/src/main/assets/
          cat << 'EOF' > app/src/main/java/com/sys/update/MainActivity.java
          package com.sys.update;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sys.update">
              <application android:label="System Update">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: Compile and Sign APK
        run: |
          mkdir -p app/build
          cd app/build
          echo "Compiling Java..."
          javac -d . ../src/main/java/com/sys/update/MainActivity.java
          echo "Creating Dex..."
          d8 --output . com/sys/update/MainActivity.class
          echo "Zipping Assets..."
          cp ../src/main/assets/index.html .
          cp ../src/main/AndroidManifest.xml .
          cp classes.dex .
          zip -r base.zip index.html AndroidManifest.xml classes.dex
          echo "Generating Keystore..."
          keytool -genkey -v -keystore my-release-key.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"
          echo "Signing APK (Debug mode)..."
          java -jar $ANDROID_HOME/build-tools/30.0.3/lib/apksigner.jar sign --ks my-release-key.keystore --ks-pass pass:password --key-pass pass:password --out final.apk base.zip || true
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: compiled-apk
          path: app/build/final.apk
    